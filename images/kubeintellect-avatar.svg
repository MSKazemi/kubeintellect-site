<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0f2d5e"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#93c5fd"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="400" height="400" rx="90" fill="url(#bgGrad)"/>

  <!-- Subtle radial glow behind wheel -->
  <circle cx="200" cy="182" r="120" fill="#1d4ed8" opacity="0.12"/>

  <!-- === KUBERNETES 7-SPOKE HELM WHEEL (correct geometry) === -->
  <g transform="translate(200,182)" filter="url(#glow)">

    <!-- Outer ring -->
    <circle r="108" fill="none" stroke="url(#blueGrad)" stroke-width="11" opacity="0.95"/>

    <!-- 7 spokes — computed at 51.43° intervals, inner r=38, outer r=97 -->
    <g stroke="url(#blueGrad)" stroke-width="10" stroke-linecap="round" opacity="0.95">
      <!-- spoke 0: 0° (top) -->
      <line x1="0" y1="-38" x2="0" y2="-97"/>
      <!-- spoke 1: 51.43° -->
      <line x1="29.7" y1="-23.7" x2="76.0" y2="-60.5"/>
      <!-- spoke 2: 102.86° -->
      <line x1="37.1" y1="8.5" x2="95.0" y2="21.7"/>
      <!-- spoke 3: 154.29° -->
      <line x1="16.5" y1="34.2" x2="42.3" y2="87.5"/>
      <!-- spoke 4: 205.71° -->
      <line x1="-16.5" y1="34.2" x2="-42.3" y2="87.5"/>
      <!-- spoke 5: 257.14° -->
      <line x1="-37.1" y1="8.5" x2="-95.0" y2="21.7"/>
      <!-- spoke 6: 308.57° -->
      <line x1="-29.7" y1="-23.7" x2="-76.0" y2="-60.5"/>
    </g>

    <!-- Hub: dark fill + ring -->
    <circle r="37" fill="#0a1628" stroke="url(#blueGrad)" stroke-width="10"/>

    <!-- Neural / AI pattern inside hub -->
    <!-- center node -->
    <circle r="7" fill="#60a5fa" filter="url(#softglow)"/>
    <!-- 3 satellite nodes -->
    <circle cx="0" cy="-18" r="4" fill="#93c5fd" opacity="0.9"/>
    <circle cx="15.6" cy="9" r="4" fill="#93c5fd" opacity="0.9"/>
    <circle cx="-15.6" cy="9" r="4" fill="#93c5fd" opacity="0.9"/>
    <!-- connecting lines -->
    <line x1="0" y1="0" x2="0" y2="-18" stroke="#60a5fa" stroke-width="2" opacity="0.7"/>
    <line x1="0" y1="0" x2="15.6" y2="9" stroke="#60a5fa" stroke-width="2" opacity="0.7"/>
    <line x1="0" y1="0" x2="-15.6" y2="9" stroke="#60a5fa" stroke-width="2" opacity="0.7"/>
    <!-- triangle links -->
    <line x1="0" y1="-18" x2="15.6" y2="9" stroke="#60a5fa" stroke-width="1.2" opacity="0.4"/>
    <line x1="15.6" y1="9" x2="-15.6" y2="9" stroke="#60a5fa" stroke-width="1.2" opacity="0.4"/>
    <line x1="-15.6" y1="9" x2="0" y2="-18" stroke="#60a5fa" stroke-width="1.2" opacity="0.4"/>

  </g>

  <!-- "KUBE" bold wordmark -->
  <text
    x="200" y="327"
    text-anchor="middle"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-weight="800"
    font-size="52"
    letter-spacing="5"
    fill="#f1f5f9"
  >KUBE</text>

  <!-- "INTELLECT" light sub-label -->
  <text
    x="200" y="365"
    text-anchor="middle"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-weight="300"
    font-size="20"
    letter-spacing="11"
    fill="#60a5fa"
    opacity="0.85"
  >INTELLECT</text>
</svg>
